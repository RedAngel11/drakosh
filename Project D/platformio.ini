[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs ; Обязательно для хранения wav файлов

build_flags = 
    -DCORE_DEBUG_LEVEL=0 ; Отключаем системный спам в консоль
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^7.0.0       ; Для парсинга команд от реле
    adafruit/Adafruit NeoPixel@^1.12.3 ; Для светодиодов
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0 ; Для PCA9685
    adafruit/Adafruit BusIO@^1.14.1
    adafruit/Adafruit GFX Library@^1.11.9 ; Для дисплеев
    adafruit/Adafruit GC9A01A@^1.0.0    ; Для круглых экранов
    wire